server {
    listen 80;
    server_name _;

    client_max_body_size 20M;

    # Không retry khi upstream lỗi — tránh 508 Loop Detected
    proxy_next_upstream off;

    # Timeout hợp lý cho proxy (backend có thể chậm khi DB busy)
    proxy_connect_timeout 10s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # Frontend Manager Web UI
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # REST API Proxy
    location /api/ {
        proxy_pass http://backend:8000/api/;

        # Forward thông tin client thật để rate limiter dùng đúng IP
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Không retry — tránh loop khi backend timeout
        proxy_next_upstream off;
    }

    # Static Screenshots Proxy
    location /static/ {
        proxy_pass http://backend:8000/static/;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
    }

    # WebSocket Real-time Stream Proxy (WSS / WS)
    location /ws/ {
        proxy_pass http://backend:8000/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade         $http_upgrade;
        proxy_set_header Connection      "Upgrade";
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 86400;
    }
}
